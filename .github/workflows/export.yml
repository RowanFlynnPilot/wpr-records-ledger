name: export

# Nightly: test, then read the log as ledger_export, validate it with law.py,
# and deploy the site with its JSON and CSV to GitHub Pages as an Actions
# artifact. Data is never committed. The logs of a public repo are public:
# export.py prints only published counts, and a validation failure prints
# only how many requests failed (see --name-requests, run locally).
# After a successful export, the snapshot job freezes the data as a release for
# the quarter that last ended, once (see snapshot.py).

on:
  schedule:
    - cron: "37 10 * * *"   # 10:37 UTC: 5:37 a.m. CDT, 4:37 a.m. CST
  workflow_dispatch:

permissions: {}   # each job asks for only what it needs

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    services:
      # A throwaway Postgres for the end-to-end test only; never sees real data.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install -r requirements.txt

      - name: Tests, including the end-to-end export against local Postgres
        env:
          LEDGER_TEST_DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: python -m pytest tests

      - name: Export as ledger_export
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python export.py --out site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Hand the data to the snapshot job
        uses: actions/upload-artifact@v4
        with:
          name: data
          path: site/data
          retention-days: 1

      - id: deployment
        uses: actions/deploy-pages@v4

  # The only job that can write to the repo, and all it writes is a release.
  snapshot:
    needs: export
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Which quarter, and is it frozen yet?
        id: tag
        run: |
          tag=$(python snapshot.py)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.tag.outputs.exists == 'false'
        uses: actions/download-artifact@v4
        with:
          name: data
          path: data

      - name: Freeze the quarter's data as a release
        if: steps.tag.outputs.exists == 'false'
        run: |
          as_of=$(python -c "import json; print(json.load(open('data/meta.json'))['as_of'])")
          gh release create "${{ steps.tag.outputs.tag }}" data/*.csv data/*.json             --title "Data, ${{ steps.tag.outputs.tag }}"             --notes "The Records Ledger's published data as exported on $as_of, the first successful nightly export after the quarter ended. Frozen so a figure cited in a story can be checked later. CC BY 4.0: credit Wausau Pilot & Review. It is WPR's own experience as one requester, not a measure of how an agency treats others; see the site's methodology."
